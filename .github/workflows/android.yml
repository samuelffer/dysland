name: Android · build, test & package
on:
  push:
    paths-ignore: ['Zips/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile, unit test, and lint
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/build.log").read_text().splitlines()[-120:]); print("::error::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          fi
          exit "$code"
      - name: Verify debug APK signature
        run: |
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Package and validate ZIP
        run: |
          # Rebuilds validate the package again without replacing a previously published ZIP.
          mkdir -p /tmp/published
          if [ -f Zips/dysland-0.1.0-android-debug.zip ]; then
            mv Zips/dysland-0.1.0-android-debug.zip /tmp/published/
          fi
          python3 scripts/package.py
      - uses: actions/upload-artifact@v5
        with:
          name: dysland-0.1.0-android-debug
          path: Zips/dysland-0.1.0-android-debug.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: ${{ always() && hashFiles('app/build/reports/**') != '' }}
        with:
          name: android-reports
          path: |
            app/build/reports/
          if-no-files-found: error
          retention-days: 14
