name: Android · build, test & package
on:
  push:
    paths-ignore: ['Zips/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile, unit test, and lint
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/build.log").read_text().splitlines()[-120:]); print("::error::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
          fi
          exit "$code"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android 35 instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device-tests.sh
      - name: Instrumentation diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          paths = [Path('/tmp/device-tests.log')]
          paths += list(Path('app/build/outputs/androidTest-results').rglob('*.xml'))
          for p in paths:
              if p.is_file():
                  s = p.read_text(errors='replace')[-20000:]
                  print('::error::' + str(p) + '%0A' + s.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PYDIAG
          adb devices || true
      - name: Verify debug APK signature
        run: |
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Package and validate ZIP
        run: |
          python3 scripts/package.py
      - uses: actions/upload-artifact@v5
        with:
          name: dysland-0.1.0-android-debug
          path: Zips/dysland-0.1.0-android-debug.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: ${{ always() && hashFiles('app/build/reports/**') != '' }}
        with:
          name: android-reports
          path: |
            app/build/reports/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: ${{ success() }}
        with:
          name: android-screenshot
          path: screenshots/dysland-home.png
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: ${{ github.event_name == 'push' && github.repository == 'samuelffer/dysland' && github.ref == 'refs/heads/arena/7e2b3c57-dysland' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: dysland-0.1.0-android-debug
          path: Zips
      - name: Publish only the new ZIP, never overwrite or rebase
        run: |
          remote_sha=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA" || { echo "Branch advanced; refusing to publish stale binary"; exit 1; }
          if git ls-files --error-unmatch Zips/dysland-0.1.0-android-debug.zip >/dev/null 2>&1; then
            echo "Package already published; no overwrite."
            exit 0
          fi
          python3 -c 'import zipfile; z=zipfile.ZipFile("Zips/dysland-0.1.0-android-debug.zip"); assert z.testzip() is None; assert "dysland-0.1.0-debug.apk" in z.namelist()'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Zips/dysland-0.1.0-android-debug.zip
          git commit -m "build: publish validated Dysland 0.1.0 Android debug ZIP"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
